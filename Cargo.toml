[package]
name = "imgs"
version = "0.1.0"
edition = "2021"
default-run = "imgs"

[dependencies]
candle-core = "0.8"
candle-nn = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
indicatif = "0.17"
zip = "0.6"
rand = "0.8"
ratatui = "0.28"
crossterm = "0.28"
hf-hub = "0.3"
parquet = "53"
chrono = "0.4"
